name: Nightly Audit
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Run auditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv sync
          uv run python scripts/agent.py
      - name: Commit scorecards
        run: |
          git config user.name "auditor[bot]"
          git config user.email "agent@brianpelow.github.io"
          git add reports/
          git diff --staged --quiet || git commit -m "chore(agent): audit scorecard $(date -u +%Y-%m-%d)"
          git push
